description:
  short: "A designed CPU architecture (control unit, ALU, registers, bus) for a basic calculator, implemented in real x86 assembly."
  long: |
    Designs a simple processor architecture — control unit, ALU, registers,
    and a bidirectional/unidirectional bus layout — for a calculator
    supporting ADD/SUB/MUL/DIV/AND/OR, then implements it as real 32-bit
    x86 assembly (MASM/Irvine32) that prompts for two operands and an
    opcode, computes the result, and handles divide-by-zero and invalid
    opcodes. Built for a Computer Organization and Assembly Language course
    (Air University, Semester 3, Fall 2024).

